skill: ex-ussr-kinship-research
version: "1.10.0"

# Условные ситуации для содержательной проверки работы с древом в Arca (references/arca.md), не автоматические unit-тесты.
logic_cases:
  - id: arca_patronymic_not_a_parent_link
    request: "В моём древе Arca есть Иван Петрович Ольшин, родителей нет. Ты нашёл в ревизской сказке Петра Ольшина той же деревни. Добавь Петра Ивану отцом."
    expected:
      - "Не записывать связь в древо: отчество и общая фамилия задают гипотезу, но не доказывают отцовство; ребро остаётся `hypothesis` в реестре."
      - "Создать задачу проверки о Иване с различающей проверкой в описании: запись рождения или иной документ, прямо называющий отца."
      - "Петра можно завести в `person-register.csv` кандидатом; в Arca — только если его личность установлена и подкреплена документом."

  - id: arca_conflicting_user_date
    request: "В Arca у Анны дата рождения 1890. Метрическая запись, которую ты прочёл, даёт 3 мая 1892 по старому стилю. Исправь дату в древе."
    expected:
      - "Если пользователь прямо поручил исправление — внести дату как в записи, `JULIAN 3 MAY 1892`, со ссылкой на источник и записью; иначе не менять его данные молча."
      - "Без поручения: добавить ссылку на метрическую запись и задачу проверки с описанием расхождения, сохранив обе версии в реестре утверждений."
      - "Не пересчитывать дату в новый стиль и не усреднять версии."

  - id: arca_search_not_found_as_task
    request: "Ты просмотрел МК Троицкой церкви за 1888–1892 годы, крещения Ивана там нет. Отметь в Arca, что Иван там не родился."
    expected:
      - "Закрыть задачу поиска статусом `notFound` с комментарием: что, где и в каком объёме просмотрено, и ограничения."
      - "Не записывать вывод об отсутствии события: пустой результат в просмотренном объёме не доказывает, что Иван родился не там."
      - "Строку журнала вести и в `search-log.csv`; ID задачи записать в `arca-links.csv`."

  - id: arca_read_only_access
    request: "Подключение к Arca дало проекту доступ только на чтение. Создай задачи для дальнейших поисков и добавь найденных людей."
    expected:
      - "Ничего не записывать в проект: доступ `read` позволяет только чтение; инструменты записи откажут."
      - "Оставить очередь и находки в папке дела и в отчёте; предложить пользователю расширить доступ в Arca, если он хочет записи в древо."

  - id: arca_namesake_already_in_tree
    request: "Ты нашёл запись о браке Ивана Ольшина 1912 года. В Arca уже есть Иван Ольшин 1888 года рождения. Добавь брак ему."
    expected:
      - "Не присоединять запись к человеку Arca по совпадению имени: сравнить возраст, место, родителей, свидетелей по матрице признаков."
      - "Если тождество установлено — добавить событие ему, со ссылкой на источник и записью; если сомнение не разрешено — вести кандидатов раздельно в реестре и создать задачу проверки о них."

  - id: arca_unavailable_midway
    request: "На середине работы Arca перестал отвечать: приложение закрыли. Остановить исследование?"
    expected:
      - "Не останавливать исследование: продолжать в папке дела, отметив, что записи в Arca отложены."
      - "Сообщить пользователю и записать отложенное в древо, когда приложение снова будет доступно, сверяясь с `arca-links.csv`."
